<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학교생활 앱 - 베타버전 데모</title>
<meta name="description" content="학교생활 앱 - 베타버전 데모">
<meta name="theme-color" content="#0d0f12">
<meta property="og:title" content="학교생활 앱 - 베타버전 데모">
<meta property="og:type" content="video.other">
<style>
  :root {
    --bg: #0d0f12;
    --panel: #16191f;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4f9cf9;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
                 "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3vw, 24px);
    padding: clamp(16px, 4vw, 40px);
    padding-top: max(clamp(16px, 4vw, 40px), env(safe-area-inset-top));
    padding-bottom: max(clamp(16px, 4vw, 40px), env(safe-area-inset-bottom));
  }

  header {
    width: 100%;
    max-width: 1100px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(0.68rem, 2.8vw, 1.25rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.4;
    word-break: keep-all;
  }

  h1 .x {
    color: var(--muted);
    font-weight: 400;
    margin: 0 2px;
  }

  .stage {
    width: 100%;
    max-width: 1100px;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
    line-height: 0;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 78svh;
    background: #000;
    outline: none;
  }

  video:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  button, a.btn {
    appearance: none;
    border: 1px solid #2a2f38;
    background: var(--panel);
    color: var(--fg);
    font: inherit;
    font-size: clamp(0.78rem, 2.6vw, 0.88rem);
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    line-height: 1.2;
    transition: background .15s, border-color .15s;
  }

  button:hover, a.btn:hover { background: #1e232b; border-color: #3a414d; }
  button:active, a.btn:active { background: #262c36; }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (orientation: landscape) and (max-height: 500px) {
    body { gap: 8px; padding: 8px; }
    header, .bar { display: none; }
    video { max-height: calc(100svh - 16px); }
    .stage { border-radius: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>학교생활 앱 <span class="x">-</span> 베타버전 데모</h1>
</header>

<div class="stage">
  <video
    id="player"
    src="hansol_hs_demo_final.mp4"
    controls
    playsinline
    webkit-playsinline
    preload="metadata">
    이 브라우저는 video 태그를 지원하지 않습니다.
    <a href="hansol_hs_demo_final.mp4">영상 다운로드</a>
  </video>
</div>

<div class="bar">
  <button type="button" id="replay">처음부터</button>
  <button type="button" id="full">전체화면</button>
</div>

<script>
(function () {
  var v = document.getElementById('player');

  document.getElementById('replay').addEventListener('click', function () {
    v.currentTime = 0;
    v.play();
  });

  function toggleFull() {
    var el = v.parentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (v.webkitEnterFullscreen) {
      v.webkitEnterFullscreen();
    }
  }

  document.getElementById('full').addEventListener('click', toggleFull);

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case ' ':
      case 'k':
        e.preventDefault();
        v.paused ? v.play() : v.pause();
        break;
      case 'ArrowRight':
        e.preventDefault();
        v.currentTime = Math.min(v.duration || Infinity, v.currentTime + 5);
        break;
      case 'ArrowLeft':
        e.preventDefault();
        v.currentTime = Math.max(0, v.currentTime - 5);
        break;
      case 'f':
        toggleFull();
        break;
      case 'm':
        v.muted = !v.muted;
        break;
    }
  });
})();
</script>

</body>
</html>
